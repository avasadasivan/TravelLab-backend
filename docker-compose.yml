# Local Postgres for development and tests: `npm run db:up` (Postgres only).
# The whole backend in containers: `npm run docker:up` (Postgres + API).
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: travellab
      POSTGRES_PASSWORD: travellab
      POSTGRES_DB: travellab
    ports:
      - '5432:5432'
    volumes:
      # Named volume, so the data survives `docker compose down` and restarts.
      - travellab-data:/var/lib/postgresql/data
      # Runs once, when the volume is first created: makes the test database.
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U travellab -d travellab']
      interval: 2s
      timeout: 5s
      retries: 15

  # The API built from the Dockerfile. Uses port 3001, so stop
  # `npm run start:dev` first, or run only Postgres with `npm run db:up`.
  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Inside Docker's network the database's host name is the service name.
      DATABASE_URL: postgresql://travellab:travellab@postgres:5432/travellab
      FRONTEND_ORIGIN: http://localhost:3000
      PORT: 3001
    ports:
      - '3001:3001'
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:3001/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  travellab-data:
