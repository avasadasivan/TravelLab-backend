name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    # A throwaway Postgres for the tests, same version as docker-compose.yml.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: travellab
          POSTGRES_PASSWORD: travellab
          POSTGRES_DB: travellab_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U travellab -d travellab_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    env:
      DATABASE_URL: postgresql://travellab:travellab@localhost:5432/travellab_test
      TEST_DATABASE_URL: postgresql://travellab:travellab@localhost:5432/travellab_test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # Also runs `prisma generate` (postinstall).
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run build
      - run: npm test
      - run: npm run test:e2e
